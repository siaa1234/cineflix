name: Load Test (k6)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target site URL'
        required: true
        default: 'https://laksidu.site'
      total_requests:
        description: 'Total number of requests'
        required: true
        default: '100000'
      concurrency:
        description: 'Concurrent virtual users'
        required: true
        default: '500'

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Increase system limits
        run: |
          ulimit -n 65535
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535"
          sudo sysctl -w net.core.somaxconn=65535

      - name: Run k6 load test
        run: |
          ulimit -n 65535
          cat > test.js <<'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Counter } from 'k6/metrics';

          const TARGET = __ENV.TARGET_URL;
          const TOTAL = Number(__ENV.TOTAL_REQUESTS);
          const VUS = Number(__ENV.CONCURRENCY);
          const ITER_PER_VU = Math.ceil(TOTAL / VUS);

          const statusErrors = new Counter('status_errors');

          export const options = {
            vus: VUS,
            iterations: ITER_PER_VU * VUS,
            thresholds: {
              // exit code 99 නැවත එන්නේ නැති විදිහට ලිහිල් කළා
              http_req_failed: ['rate<0.90'],
              http_req_duration: ['p(95)<10000'],
            },
            // connection reuse — runner port exhaustion අඩු කරන්න
            noConnectionReuse: false,
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36',
          };

          export default function () {
            const params = {
              headers: {},
            };

            // CF WAF skip rule එකකට match වෙන්න optional secret token
            if (__ENV.LOADTEST_TOKEN) {
              params.headers['X-Loadtest-Token'] = __ENV.LOADTEST_TOKEN;
            }

            const res = http.get(TARGET, params);

            if (res.status !== 200) {
              statusErrors.add(1);
              // non-200 හැම එකකට log — ඒත් volume වැඩි නිසා 10% sample
              if (Math.random() < 0.1) {
                console.log(`STATUS ${res.status} | url=${TARGET} | body: ${res.body.substring(0, 200)}`);
              }
            }

            check(res, { 'status 200': (r) => r.status === 200 });
          }

          export function handleSummary(data) {
            return {
              stdout: textSummary(data, { indent: ' ', enableColors: true }),
            };
          }
          EOF

          k6 run test.js
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          TOTAL_REQUESTS: ${{ github.event.inputs.total_requests }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          LOADTEST_TOKEN: ${{ secrets.LOADTEST_TOKEN }}
