name: Load Test (k6)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target site URL'
        required: true
        default: 'https://laksidu.site'
      total_requests:
        description: 'Total number of requests'
        required: true
        default: '100000'
      concurrency:
        description: 'Concurrent virtual users'
        required: true
        default: '500'

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Increase system limits
        run: |
          ulimit -n 65535
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535"
          sudo sysctl -w net.core.somaxconn=65535

      - name: Run k6 load test
        run: |
          ulimit -n 65535
          cat > test.js <<'EOF'
          import http from 'k6/http';
          import { check } from 'k6';

          const TOTAL = Number(__ENV.TOTAL_REQUESTS);
          const VUS = Number(__ENV.CONCURRENCY);
          const ITER_PER_VU = Math.ceil(TOTAL / VUS);

          export const options = {
            vus: VUS,
            iterations: ITER_PER_VU * VUS,   // total requests එකට සමාන වෙනවා
            // නැත්නම් duration-based: duration: '10m'
            thresholds: {
              http_req_failed: ['rate<0.10'],   // error rate 10% ට වඩා වැඩි නම් test fail
            },
          };

          export default function () {
            const res = http.get(__ENV.TARGET_URL);
            check(res, { 'status 200': (r) => r.status === 200 });
          }
          EOF

          k6 run test.js
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          TOTAL_REQUESTS: ${{ github.event.inputs.total_requests }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
