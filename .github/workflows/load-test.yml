name: Load Test

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target URL (ඔයාගේ site එක)'
        required: true
        default: 'https://laksidu.site'
      vus:
        description: 'Virtual Users'
        required: true
        default: '50'

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D964F7F7
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Create test script
        env:
          TARGET: ${{ github.event.inputs.target }}
          VUS: ${{ github.event.inputs.vus }}
        run: |
          cat > test.js <<EOF
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            stages: [
              { duration: '1m', target: $VUS },   // ramp up
              { duration: '3m', target: $VUS },   // sustain
              { duration: '1m', target: 0 },      // ramp down
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],   // 95% requests < 500ms
              http_req_failed: ['rate<0.01'],     // error rate < 1%
            },
          };

          export default function () {
            const res = http.get('$TARGET');
            check(res, { 'status is 200': (r) => r.status === 200 });
            sleep(1);
          }
          EOF

      - name: Run load test
        run: k6 run --summary-export=summary.json test.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-summary
          path: summary.json
